name: bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  reply:
    # Issue opening is always handled (the maintainer gets silent labeling,
    # visitors get the full triage). Comments and PRs serve visitors only:
    # never react to the maintainer, to bots, or to itself.
    if: >
      github.event_name == 'issues' ||
      (github.actor != 'BaaRai' &&
       github.actor != 'Mohamed2820' &&
       github.actor != 'github-actions[bot]' &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: triage or reply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: bash .github/scripts/bot.sh
