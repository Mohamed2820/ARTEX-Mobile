name: upstream-drift-check

on:
  push:
    branches: [main]
    paths:
      - UPSTREAM.md
      - docs/upstream/refs-manifest.tsv
      - .github/workflows/upstream-check.yml
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare upstream main with import baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream commit
        shell: bash
        run: |
          set -euo pipefail
          expected="ab40834567475c449bb34f84a9aa50a6587cb471"
          actual="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BaaRai/ARTEX/commits/main | jq -r .sha)"
          if [[ -z "$actual" || "$actual" == "null" ]]; then
            echo "::error::Could not read upstream main commit."
            exit 1
          fi
          echo "Import baseline: $expected"
          echo "Current upstream: $actual"
          if [[ "$actual" != "$expected" ]]; then
            echo "::warning::Upstream has advanced. Review the diff; this workflow never merges or pushes."
            exit 1
          fi
          echo "Upstream is unchanged from the recorded import baseline."
